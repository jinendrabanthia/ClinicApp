<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel | TriageAID Clinic Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #050816;
      --surface: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08);
      --text: #e2e8f0;
      --text-muted: #64748b;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 60% 40% at 20% 10%, rgba(99,102,241,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 50% 30% at 80% 80%, rgba(139,92,246,0.06) 0%, transparent 60%);
    }

    nav {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; gap: 20px;
      padding: 18px 40px;
      background: rgba(5,8,22,0.9); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .logo {
      display: flex; align-items: center; gap: 10px;
      font-family: 'Outfit', sans-serif; font-size: 18px; font-weight: 700;
    }
    .logo-icon { width: 36px; height: 36px; background: linear-gradient(135deg, #6366f1, #8b5cf6); border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .nav-badge { font-size: 11px; font-weight: 600; padding: 3px 10px; background: rgba(99,102,241,0.15); border: 1px solid rgba(99,102,241,0.3); border-radius: 20px; color: #a5b4fc; }
    .back-link { color: var(--text-muted); text-decoration: none; font-size: 14px; transition: color 0.2s; margin-left: auto; }
    .back-link:hover { color: var(--text); }

    main { max-width: 1300px; margin: 0 auto; padding: 40px 24px 100px; position: relative; z-index: 1; }

    h1 { font-family: 'Outfit', sans-serif; font-size: 32px; font-weight: 700; margin-bottom: 6px; }
    .page-sub { color: var(--text-muted); font-size: 15px; margin-bottom: 36px; }

    /* Stats */
    .stats-row { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 36px; }
    .stat-box {
      flex: 1; min-width: 160px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 20px 24px;
      backdrop-filter: blur(20px);
    }
    .stat-num { font-family: 'Outfit', sans-serif; font-size: 36px; font-weight: 700; }
    .stat-lbl { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
    .stat-box.critical .stat-num { color: #ef4444; }
    .stat-box.urgent .stat-num { color: #f97316; }
    .stat-box.routine .stat-num { color: #10b981; }
    .stat-box.total .stat-num { color: #a5b4fc; }

    /* Toolbar */
    .toolbar {
      display: flex; gap: 12px; flex-wrap: wrap;
      align-items: center; margin-bottom: 20px;
    }
    .search-box {
      flex: 1; min-width: 220px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px; padding: 11px 16px;
      color: var(--text); font-family: 'Inter', sans-serif; font-size: 14px;
      outline: none; transition: border-color 0.2s;
    }
    .search-box:focus { border-color: #6366f1; }
    .search-box::placeholder { color: #334155; }
    .filter-btn {
      padding: 10px 18px;
      border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
      color: var(--text-muted); font-size: 13px; font-weight: 500;
      cursor: pointer; transition: all 0.2s; white-space: nowrap;
    }
    .filter-btn.active { border-color: #6366f1; background: rgba(99,102,241,0.15); color: #a5b4fc; }
    .filter-btn:hover:not(.active) { border-color: rgba(255,255,255,0.2); color: var(--text); }
    .refresh-btn {
      padding: 10px 18px;
      border-radius: 10px; border: 1px solid rgba(99,102,241,0.3);
      background: rgba(99,102,241,0.1);
      color: #a5b4fc; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: all 0.2s; white-space: nowrap;
    }
    .refresh-btn:hover { background: rgba(99,102,241,0.2); }

    /* Table */
    .table-wrapper {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; overflow: hidden;
      backdrop-filter: blur(20px);
    }
    table { width: 100%; border-collapse: collapse; }
    thead tr { border-bottom: 1px solid rgba(255,255,255,0.07); }
    th {
      text-align: left; padding: 16px 18px;
      font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 1.2px;
      color: var(--text-muted);
    }
    tbody tr {
      border-bottom: 1px solid rgba(255,255,255,0.04);
      transition: background 0.2s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(255,255,255,0.04); }
    td {
      padding: 14px 18px;
      font-size: 14px;
      vertical-align: top;
    }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 12px; border-radius: 20px;
      font-size: 12px; font-weight: 700; letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .badge.CRITICAL { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.35); color: #ef4444; }
    .badge.URGENT { background: rgba(249,115,22,0.15); border: 1px solid rgba(249,115,22,0.35); color: #f97316; }
    .badge.ROUTINE { background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.3); color: #10b981; }
    .badge-dot { width: 7px; height: 7px; border-radius: 50%; }
    .CRITICAL .badge-dot { background: #ef4444; animation: blink 1.5s infinite; }
    .URGENT .badge-dot { background: #f97316; }
    .ROUTINE .badge-dot { background: #10b981; }
    @keyframes blink { 0%,100%{opacity:1}50%{opacity:0.2} }

    .ticket-cell { font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 600; color: #6366f1; }
    .reasoning-cell { max-width: 260px; font-size: 13px; color: var(--text-muted); line-height: 1.6; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

    /* Empty state */
    .empty-state { text-align: center; padding: 60px 24px; }
    .empty-state .icon { font-size: 56px; margin-bottom: 16px; }
    .empty-state h3 { font-family: 'Outfit', sans-serif; font-size: 22px; font-weight: 600; margin-bottom: 8px; }
    .empty-state p { color: var(--text-muted); font-size: 14px; }

    @media (max-width: 900px) {
      .reasoning-cell { display: none; }
    }
    @media (max-width: 600px) {
      main { padding: 24px 16px 80px; }
      nav { padding: 16px 20px; }
    }
  </style>
</head>
<body>

  <nav>
    <div class="logo">
      <div class="logo-icon">🏥</div>
      <span>TriageAID</span>
    </div>
    <span class="nav-badge">ADMIN</span>
    <a href="/" class="back-link">← Back to Home</a>
  </nav>

  <main>
    <h1>Clinic Dashboard</h1>
    <p class="page-sub">Live patient waiting list and triage overview — refreshes automatically</p>

    <!-- Stats -->
    <div class="stats-row" id="statsRow">
      <div class="stat-box total"><div class="stat-num" id="statTotal">—</div><div class="stat-lbl">Total Patients</div></div>
      <div class="stat-box critical"><div class="stat-num" id="statCritical">—</div><div class="stat-lbl">Critical</div></div>
      <div class="stat-box urgent"><div class="stat-num" id="statUrgent">—</div><div class="stat-lbl">Urgent</div></div>
      <div class="stat-box routine"><div class="stat-num" id="statRoutine">—</div><div class="stat-lbl">Routine</div></div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <input type="search" class="search-box" id="searchBox" placeholder="🔍 Search by name, ticket, or symptom..." oninput="filterTable()" />
      <button class="filter-btn active" id="filterAll" onclick="setFilter('all')">All</button>
      <button class="filter-btn" id="filterCritical" onclick="setFilter('CRITICAL')">🔴 Critical</button>
      <button class="filter-btn" id="filterUrgent" onclick="setFilter('URGENT')">🟠 Urgent</button>
      <button class="filter-btn" id="filterRoutine" onclick="setFilter('ROUTINE')">🟢 Routine</button>
      <button class="refresh-btn" onclick="loadData()">↻ Refresh</button>
    </div>

    <!-- Table -->
    <div class="table-wrapper">
      <table id="waitingTable">
        <thead>
          <tr>
            <th>Ticket</th>
            <th>Date / Time</th>
            <th>Patient</th>
            <th>Age</th>
            <th>Chief Complaint</th>
            <th>Pain</th>
            <th>Level</th>
            <th class="reasoning-col">AI Notes</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="8"><div class="empty-state"><div class="icon">⏳</div><h3>Loading...</h3></div></td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script>
    let allRows = [];
    let currentFilter = 'all';

    async function loadData() {
      try {
        const res = await fetch('/api/waiting-list');
        const data = await res.json();
        allRows = data.rows || [];
        updateStats();
        renderTable();
      } catch (e) {
        document.getElementById('tableBody').innerHTML = `
          <tr><td colspan="8"><div class="empty-state">
            <div class="icon">⚠️</div>
            <h3>Could not load data</h3>
            <p>Make sure the server is running and try again.</p>
          </div></td></tr>`;
      }
    }

    function updateStats() {
      const total = allRows.length;
      const critical = allRows.filter(r => r['Triage Level'] === 'CRITICAL').length;
      const urgent = allRows.filter(r => r['Triage Level'] === 'URGENT').length;
      const routine = allRows.filter(r => r['Triage Level'] === 'ROUTINE').length;
      document.getElementById('statTotal').textContent = total;
      document.getElementById('statCritical').textContent = critical;
      document.getElementById('statUrgent').textContent = urgent;
      document.getElementById('statRoutine').textContent = routine;
    }

    function setFilter(f) {
      currentFilter = f;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      const map = { all: 'filterAll', CRITICAL: 'filterCritical', URGENT: 'filterUrgent', ROUTINE: 'filterRoutine' };
      document.getElementById(map[f]).classList.add('active');
      renderTable();
    }

    function filterTable() { renderTable(); }

    function renderTable() {
      const search = document.getElementById('searchBox').value.toLowerCase();
      let filtered = allRows;

      if (currentFilter !== 'all') {
        filtered = filtered.filter(r => r['Triage Level'] === currentFilter);
      }
      if (search) {
        filtered = filtered.filter(r =>
          (r['Patient Name'] || '').toLowerCase().includes(search) ||
          (r['Ticket No.'] || '').toLowerCase().includes(search) ||
          (r['Chief Complaint'] || '').toLowerCase().includes(search)
        );
      }

      // Sort: critical first, then urgent, then routine; newest first within each
      const order = { CRITICAL: 0, URGENT: 1, ROUTINE: 2 };
      filtered.sort((a, b) => (order[a['Triage Level']] || 2) - (order[b['Triage Level']] || 2));

      const tbody = document.getElementById('tableBody');
      if (filtered.length === 0) {
        tbody.innerHTML = `
          <tr><td colspan="8"><div class="empty-state">
            <div class="icon">📋</div>
            <h3>No patients found</h3>
            <p>No entries match your current filter.</p>
          </div></td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(r => {
        const level = r['Triage Level'] || 'ROUTINE';
        return `<tr>
          <td><span class="ticket-cell">${r['Ticket No.'] || '—'}</span></td>
          <td style="white-space:nowrap;font-size:13px;color:#64748b;">${r['Date'] || ''}<br>${r['Time'] || ''}</td>
          <td>
            <div style="font-weight:600;">${r['Patient Name'] || '—'}</div>
            <div style="font-size:12px;color:#475569;">${r['Phone'] || ''}</div>
          </td>
          <td style="color:#94a3b8;">${r['Age'] || '—'}<br><span style="font-size:12px;">${r['Gender'] || ''}</span></td>
          <td style="max-width:180px;">
            <div style="overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:13px;">${r['Chief Complaint'] || '—'}</div>
            <div style="font-size:12px;color:#475569;margin-top:3px;">${r['Duration'] || ''}</div>
          </td>
          <td style="text-align:center;font-weight:700;font-family:'Outfit',sans-serif;">${r['Pain Scale'] || '—'}/10</td>
          <td><span class="badge ${level}"><span class="badge-dot"></span>${level}</span></td>
          <td class="reasoning-cell">${r['AI Reasoning'] || '—'}</td>
        </tr>`;
      }).join('');
    }

    loadData();
    // Auto-refresh every 30s
    setInterval(loadData, 30000);
  </script>
</body>
</html>
