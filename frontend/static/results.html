<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Triage Results | TriageAID</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --ink:#0f0f14;--ink2:#3d3d52;--muted:#8a8aa0;
      --bg:#f8f9ff;--white:#fff;
      --blue:#4361ee;--blue-lt:#eef0ff;
      --purple:#7b2d8b;
      --r8:8px;--r12:12px;--r16:16px;--r24:24px;
    }
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;transition:background .5s}
    body.critical{background:linear-gradient(160deg,#fff5f5 0%,#f8f9ff 50%)}
    body.urgent{background:linear-gradient(160deg,#fff8f1 0%,#f8f9ff 50%)}
    body.routine{background:linear-gradient(160deg,#f0fff6 0%,#f8f9ff 50%)}

    nav{
      position:sticky;top:0;z-index:200;
      display:flex;align-items:center;gap:16px;padding:14px 32px;
      background:rgba(248,249,255,0.9);backdrop-filter:blur(20px);
      border-bottom:1px solid rgba(67,97,238,.1);
    }
    .back-a{display:flex;align-items:center;gap:7px;color:var(--muted);text-decoration:none;font-size:14px;transition:color .2s}
    .back-a:hover{color:var(--blue)}
    .logo{display:flex;align-items:center;gap:10px;font-family:'Syne',sans-serif;font-size:17px;font-weight:800;color:var(--ink)}
    .logo span{color:var(--blue)}
    .logo-icon{width:34px;height:34px;background:linear-gradient(135deg,#4361ee,#7b2d8b);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:0 4px 12px rgba(67,97,238,.3)}

    main{max-width:740px;margin:0 auto;padding:48px 24px 100px}

    /* RESULT HERO CARD */
    @keyframes cardPop{
      0%{opacity:0;transform:scale(.92) translateY(20px)}
      70%{transform:scale(1.02)}
      100%{opacity:1;transform:scale(1) translateY(0)}
    }
    @keyframes iconBounce{
      0%{transform:scale(0) rotate(-30deg)}
      60%{transform:scale(1.2) rotate(5deg)}
      80%{transform:scale(0.95)}
      100%{transform:scale(1) rotate(0)}
    }
    @keyframes critRing{
      0%{transform:translate(-50%,-50%) scale(.5);opacity:1}
      100%{transform:translate(-50%,-50%) scale(2.5);opacity:0}
    }
    @keyframes fadeSlideUp{
      from{opacity:0;transform:translateY(20px)}
      to{opacity:1;transform:translateY(0)}
    }
    @keyframes barGrow{from{width:0}to{width:var(--w)}}
    @keyframes confetti{
      0%{transform:translateY(0) rotate(0);opacity:1}
      100%{transform:translateY(180px) rotate(720deg);opacity:0}
    }
    @keyframes spin{to{transform:rotate(360deg)}}

    .result-hero{
      border-radius:var(--r24);padding:40px 36px;text-align:center;
      position:relative;overflow:hidden;margin-bottom:20px;
      animation:cardPop .65s cubic-bezier(.34,1.56,.64,1) both;
    }
    .result-hero.critical{background:#fff;border:2px solid rgba(232,53,53,.2);box-shadow:0 12px 40px rgba(232,53,53,.1)}
    .result-hero.urgent{background:#fff;border:2px solid rgba(249,115,22,.2);box-shadow:0 12px 40px rgba(249,115,22,.08)}
    .result-hero.routine{background:#fff;border:2px solid rgba(22,163,74,.2);box-shadow:0 12px 40px rgba(22,163,74,.08)}

    /* pulse rings */
    .ring{
      position:absolute;top:50%;left:50%;
      width:180px;height:180px;border-radius:50%;
      pointer-events:none;
    }
    .critical .ring{border:2px solid rgba(232,53,53,.3);animation:critRing 1.8s ease-out infinite}
    .critical .ring:nth-child(2){animation-delay:.6s}
    .critical .ring:nth-child(3){animation-delay:1.2s}

    .lv-icon{
      font-size:72px;display:block;margin-bottom:16px;position:relative;z-index:2;
      animation:iconBounce .6s .15s cubic-bezier(.34,1.56,.64,1) both;
    }
    .lv-badge{
      display:inline-flex;align-items:center;gap:9px;
      padding:8px 24px;border-radius:40px;
      font-family:'Syne',sans-serif;font-size:18px;font-weight:800;letter-spacing:2px;
      margin-bottom:14px;position:relative;z-index:2;
    }
    .critical .lv-badge{background:rgba(232,53,53,.1);border:2px solid rgba(232,53,53,.4);color:#dc2626}
    .urgent   .lv-badge{background:rgba(249,115,22,.1);border:2px solid rgba(249,115,22,.4);color:#ea580c}
    .routine  .lv-badge{background:rgba(22,163,74,.1); border:2px solid rgba(22,163,74,.4); color:#16a34a}
    .lv-dot{width:10px;height:10px;border-radius:50%}
    .critical .lv-dot{background:#ef4444;animation:blink 1.1s infinite;box-shadow:0 0 8px rgba(239,68,68,.8)}
    .urgent   .lv-dot{background:#f97316;box-shadow:0 0 8px rgba(249,115,22,.8)}
    .routine  .lv-dot{background:#22c55e;box-shadow:0 0 8px rgba(34,197,94,.8)}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

    .res-headline{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--ink);margin-bottom:6px;position:relative;z-index:2}
    .res-subline{font-size:14px;color:var(--muted);position:relative;z-index:2;max-width:480px;margin:0 auto}
    .urgency-note{font-size:14px;font-weight:600;margin-top:12px;position:relative;z-index:2}
    .critical .urgency-note{color:#dc2626}.urgent .urgency-note{color:#ea580c}.routine .urgency-note{color:#16a34a}

    /* METRICS */
    .metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:18px;animation:fadeSlideUp .5s .2s both}
    @media(max-width:560px){.metrics{grid-template-columns:1fr 1fr}}
    .metric{
      background:var(--white);border:1px solid rgba(67,97,238,.08);border-radius:var(--r16);
      padding:16px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.03);
      transition:transform .3s cubic-bezier(.34,1.56,.64,1);
    }
    .metric:hover{transform:translateY(-4px)}
    .ml{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:8px;font-weight:600}
    .mv{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;color:var(--ink)}
    .bar{width:100%;height:7px;background:#e8eaff;border-radius:4px;margin-top:8px;overflow:hidden}
    .bar-fill{height:100%;border-radius:4px;animation:barGrow .8s .4s ease both}
    .esc-badge{display:inline-flex;align-items:center;gap:5px;background:#fefce8;border:1px solid #fcd34d;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700;color:#92400e;margin-top:6px}

    /* TICKET */
    .ticket{
      background:linear-gradient(135deg,#f0feff,#e8f4ff);
      border:2px dashed rgba(8,145,178,.3);border-radius:var(--r16);
      padding:22px;margin-bottom:16px;text-align:center;
      animation:fadeSlideUp .5s .3s both;
    }
    .ticket-lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px}
    .ticket-num{font-family:'Syne',sans-serif;font-size:36px;font-weight:800;color:#0891b2;letter-spacing:4px}

    /* ALERT BOX */
    .alert-b{
      border-radius:var(--r16);padding:16px 20px;margin-bottom:14px;
      display:flex;align-items:flex-start;gap:14px;
      animation:fadeSlideUp .5s .25s both;
    }
    .alert-b.ok{background:#f0fdf4;border:1px solid rgba(34,197,94,.25)}
    .alert-b.warn{background:#fff7ed;border:1px solid rgba(249,115,22,.25)}
    .alert-ico{font-size:24px;flex-shrink:0}
    .alert-t{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;margin-bottom:3px}
    .alert-t.gr{color:#16a34a}.alert-t.or{color:#ea580c}
    .alert-d{font-size:13px;color:var(--muted);line-height:1.6}

    /* INFO CARDS */
    .ic{
      background:var(--white);border:1px solid rgba(67,97,238,.08);border-radius:var(--r16);
      padding:22px;margin-bottom:14px;
      box-shadow:0 2px 8px rgba(0,0,0,.03);
      animation:fadeSlideUp .5s both;
      transition:box-shadow .3s;
    }
    .ic:hover{box-shadow:0 6px 24px rgba(67,97,238,.08)}
    .ic-t{font-family:'Syne',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--blue);margin-bottom:12px}
    .ic-body{font-size:14px;color:var(--ink2);line-height:1.85}

    /* RISK FACTORS */
    .factors{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
    .fc{display:flex;align-items:center;gap:5px;padding:5px 12px;background:#fff5f5;border:1px solid rgba(239,68,68,.2);border-radius:20px;font-size:12px;font-weight:600;color:#b91c1c}

    /* WAIT TAG */
    .wait-tag{display:inline-flex;align-items:center;gap:7px;margin-top:10px;padding:7px 13px;background:#f1f5f9;border-radius:9px;font-size:13px;color:#475569}

    /* PATIENT GRID */
    .pt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .pt-item{background:#f8f9ff;border-radius:var(--r12);padding:10px 14px}
    .pt-l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
    .pt-v{font-size:13px;font-weight:600;color:var(--ink)}

    /* NOTIFICATION */
    .notif-p{
      background:var(--white);border:1px solid rgba(67,97,238,.1);border-radius:var(--r16);
      padding:24px;margin-bottom:14px;
      box-shadow:0 2px 8px rgba(67,97,238,.06);
      animation:fadeSlideUp .5s .5s both;
    }
    .ntitle{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px}
    .nsub{font-size:12px;color:var(--muted);margin-bottom:18px}
    .ntabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
    .ntab{
      padding:7px 18px;border-radius:20px;border:1.5px solid #e0e2f0;
      background:#f8f9ff;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .2s;
    }
    .ntab.active{background:var(--blue-lt);border-color:var(--blue);color:var(--blue)}
    .nform{display:none}.nform.active{display:block}
    .nf-row{margin-bottom:12px}
    .nf-lbl{font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:5px;display:block}
    .nf-input{
      width:100%;border:1.5px solid #e0e2f0;border-radius:var(--r12);
      padding:10px 13px;font-size:13px;font-family:'Inter',sans-serif;
      color:var(--ink);outline:none;transition:border-color .2s;background:#f8f9ff;
    }
    .nf-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(67,97,238,.1);background:#fff}
    .nf-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
    .btn-notif{
      width:100%;padding:12px;background:linear-gradient(135deg,var(--blue),var(--purple));
      border:none;border-radius:var(--r12);color:#fff;
      font-family:'Syne',sans-serif;font-weight:700;font-size:14px;cursor:pointer;
      transition:all .3s cubic-bezier(.34,1.56,.64,1);margin-top:4px;
    }
    .btn-notif:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(67,97,238,.3)}
    .btn-notif:disabled{opacity:.6;cursor:not-allowed;transform:none}
    .notif-status{font-size:13px;margin-top:10px;text-align:center;min-height:20px}

    /* ACTIONS */
    .act-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px;animation:fadeSlideUp .5s .55s both}
    .btn-home{
      flex:1;min-width:160px;display:flex;align-items:center;justify-content:center;gap:8px;
      padding:14px 24px;background:linear-gradient(135deg,var(--blue),var(--purple));
      border:none;border-radius:var(--r16);color:#fff;
      font-family:'Syne',sans-serif;font-size:14px;font-weight:700;cursor:pointer;
      text-decoration:none;transition:all .3s cubic-bezier(.34,1.56,.64,1);
      box-shadow:0 6px 20px rgba(67,97,238,.3);
    }
    .btn-home:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(67,97,238,.4)}
    .btn-ghost{
      flex:1;min-width:130px;display:flex;align-items:center;justify-content:center;gap:8px;
      padding:13px 20px;background:var(--white);border:1.5px solid #e0e2f0;
      border-radius:var(--r16);color:var(--muted);font-size:14px;cursor:pointer;
      text-decoration:none;transition:all .2s;
    }
    .btn-ghost:hover{border-color:var(--blue);color:var(--blue)}

    .disc{text-align:center;font-size:12px;color:#bbbbd0;margin-top:28px;line-height:1.7;padding:14px;border:1px solid rgba(67,97,238,.07);border-radius:var(--r12)}

    .credits-footer{text-align:center;padding:16px 24px;font-size:13px;background:linear-gradient(135deg,rgba(67,97,238,.04),rgba(123,45,139,.04));border-top:1px solid rgba(67,97,238,.1);color:var(--muted)}
    .credits-footer strong{color:var(--blue);font-weight:600}
    .credits-footer a{color:var(--purple);text-decoration:none;font-weight:500}
    .credits-footer a:hover{text-decoration:underline}

    @media(max-width:560px){.pt-grid{grid-template-columns:1fr}.act-row{flex-direction:column}.nf-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<nav>
  <a href="/" class="back-a">← Home</a>
  <div style="flex:1"></div>
  <div class="logo"><div class="logo-icon">🏥</div><span>Triage<span>AID</span></span></div>
  <div style="flex:1"></div>
</nav>

<main id="mainContent">
  <div style="text-align:center;padding:80px 24px;color:var(--muted)">
    <div style="font-size:36px;margin-bottom:16px">
      <svg width="40" height="40" viewBox="0 0 50 50" style="animation:spin .7s linear infinite"><circle cx="25" cy="25" r="20" fill="none" stroke="#4361ee" stroke-width="4" stroke-linecap="round" stroke-dasharray="31.4 94.2"/></svg>
    </div>
    <p style="font-size:15px">Loading triage result...</p>
  </div>
</main>

<div class="credits-footer">
  made by <strong>JINENDRA BANTHIA</strong> &nbsp;·&nbsp;
  <a href="tel:9124483008">📞 9124483008</a> &nbsp;·&nbsp;
  <a href="mailto:jinendra.banthia.iter@gmail.com">✉️ jinendra.banthia.iter@gmail.com</a>
</div>

<script>
  const raw = sessionStorage.getItem('triageResult');
  if (!raw) {
    document.getElementById('mainContent').innerHTML = `
      <div style="text-align:center;padding:80px 24px">
        <div style="font-size:60px;margin-bottom:20px">⚠️</div>
        <h2 style="font-family:'Syne',sans-serif;font-size:24px;margin-bottom:12px">No result found</h2>
        <p style="color:#8a8aa0;margin-bottom:28px">Please complete the patient intake form first.</p>
        <a href="/intake" style="display:inline-flex;align-items:center;gap:10px;padding:14px 32px;background:linear-gradient(135deg,#4361ee,#7b2d8b);border-radius:14px;color:#fff;font-family:'Syne',sans-serif;font-size:16px;font-weight:700;text-decoration:none">Start Intake →</a>
      </div>`;
  } else {
    const data    = JSON.parse(raw);
    const triage  = data.triage;
    const patient = data.patient_data;
    const actions = data.actions || {};
    const level   = (triage.level || 'ROUTINE').toLowerCase();
    const lvlUp   = triage.level || 'ROUTINE';

    document.body.classList.add(level);

    const icons = { critical:'🚨', urgent:'⚠️', routine:'✅' };
    const headlines = {
      critical: 'Immediate Medical Attention Required',
      urgent:   'Same-Day Medical Attention Needed',
      routine:  "Routine Care — You're in the Queue"
    };
    const sublines = {
      critical: 'This case has been flagged as life-threatening. A doctor has been alerted immediately.',
      urgent:   'This case requires prompt attention. You have been added to the priority queue.',
      routine:  "Your condition is stable. You've been added to the waiting list."
    };

    const riskScore  = triage.risk_score || 0;
    const confidence = triage.confidence || 0.75;
    const escalated  = triage.escalated || false;
    const riskColor  = riskScore >= 75 ? '#dc2626' : riskScore >= 45 ? '#ea580c' : '#16a34a';
    const confPct    = Math.round(confidence * 100);

    const rings = level === 'critical' ? '<div class="ring"></div><div class="ring"></div><div class="ring"></div>' : '';

    const metricsHtml = `
      <div class="metrics">
        <div class="metric">
          <div class="ml">Risk Score</div>
          <div class="mv" style="color:${riskColor}">${riskScore}<span style="font-size:13px;color:#bbbbd0">/100</span></div>
          <div class="bar"><div class="bar-fill" style="width:${riskScore}%;background:${riskColor};--w:${riskScore}%"></div></div>
          ${escalated ? '<div class="esc-badge">⬆️ Safety Escalated</div>' : ''}
        </div>
        <div class="metric">
          <div class="ml">AI Confidence</div>
          <div class="mv" style="color:#4361ee">${confPct}<span style="font-size:13px;color:#bbbbd0">%</span></div>
          <div class="bar"><div class="bar-fill" style="width:${confPct}%;background:linear-gradient(90deg,#4361ee,#7b2d8b);--w:${confPct}%"></div></div>
        </div>
        <div class="metric">
          <div class="ml">Wait Estimate</div>
          <div class="mv" style="color:#4b5563">${triage.estimated_wait_minutes != null ? triage.estimated_wait_minutes+'<span style="font-size:13px;color:#bbbbd0"> min</span>' : '—'}</div>
          <div style="font-size:11px;color:#bbbbd0;margin-top:8px">Approx. queue time</div>
        </div>
      </div>`;

    const alertHtml = level !== 'routine' ? `
      <div class="alert-b ok">
        <div class="alert-ico">📧</div>
        <div>
          <div class="alert-t gr">Doctor Alert Sent</div>
          <div class="alert-d">An immediate alert has been dispatched to the clinic doctor with your complete patient details. Please remain at the clinic and inform the front desk staff.</div>
        </div>
      </div>` : '';

    const ticket = actions.ticket_number;
    const ticketHtml = ticket ? `
      <div class="ticket">
        <div class="ticket-lbl">Your Waiting List Ticket</div>
        <div class="ticket-num">${ticket}</div>
        <div style="margin-top:8px;font-size:13px;color:#8a8aa0">Show this number at the clinic counter</div>
        ${patient.email ? '<div style="margin-top:6px;font-size:12px;color:#16a34a">📨 Confirmation sent to your email</div>' : ''}
      </div>` : '';

    const factors = triage.top_risk_factors || triage.red_flags || [];
    const factorsHtml = factors.length
      ? `<div class="factors">${factors.map(f=>`<div class="fc">⚠ ${f}</div>`).join('')}</div>`
      : '<p style="font-size:13px;color:#bbbbd0">No specific risk factors identified.</p>';

    const emailVal = patient.email || '';
    const notifHtml = `
      <div class="notif-p">
        <div class="ntitle">🔔 Set Up Reminders</div>
        <div class="nsub">Receive medication reminders and appointment notifications by email.</div>
        <div class="ntabs">
          <button class="ntab active" onclick="switchNotif('med',this)">💊 Medication Reminder</button>
          <button class="ntab" onclick="switchNotif('appt',this)">📅 Appointment Reminder</button>
        </div>
        <div class="nform active" id="notif-med">
          <div class="nf-row"><label class="nf-lbl">Your Email</label><input class="nf-input" id="nfMedEmail" type="email" value="${emailVal}" placeholder="patient@example.com"/></div>
          <div class="nf-row"><label class="nf-lbl">Medicine Name(s)</label><input class="nf-input" id="nfMedNames" placeholder="e.g. Paracetamol 500mg, ORS"/></div>
          <div class="nf-grid">
            <div><label class="nf-lbl">Frequency</label><select class="nf-input" id="nfMedFreq"><option>Once Daily (Morning)</option><option>Twice Daily (Morning &amp; Night)</option><option>Three Times Daily</option><option>SOS (As needed)</option></select></div>
            <div><label class="nf-lbl">Duration (days)</label><input class="nf-input" id="nfMedDur" type="number" min="1" max="90" placeholder="e.g. 5"/></div>
          </div>
          <button class="btn-notif" id="btnMedSend" onclick="sendMedReminder()">📤 Send Medication Reminder</button>
          <div class="notif-status" id="nfMedStatus"></div>
        </div>
        <div class="nform" id="notif-appt">
          <div class="nf-row"><label class="nf-lbl">Your Email</label><input class="nf-input" id="nfApptEmail" type="email" value="${emailVal}" placeholder="patient@example.com"/></div>
          <div class="nf-grid">
            <div><label class="nf-lbl">Appointment Date</label><input class="nf-input" id="nfApptDate" type="date"/></div>
            <div><label class="nf-lbl">Appointment Time</label><input class="nf-input" id="nfApptTime" type="time"/></div>
          </div>
          <div class="nf-row"><label class="nf-lbl">Clinic / Doctor</label><input class="nf-input" id="nfApptClinic" placeholder="e.g. Dr. Rajan — PHC Meerut"/></div>
          <div class="nf-row"><label class="nf-lbl">Notes (optional)</label><input class="nf-input" id="nfApptNotes" placeholder="e.g. Bring previous reports, fasting required"/></div>
          <button class="btn-notif" id="btnApptSend" onclick="sendApptReminder()">📅 Send Appointment Reminder</button>
          <div class="notif-status" id="nfApptStatus"></div>
        </div>
      </div>`;

    document.getElementById('mainContent').innerHTML = `
      <div class="result-hero ${level}">
        ${rings}
        <span class="lv-icon">${icons[level]}</span>
        <div class="lv-badge"><span class="lv-dot"></span>${lvlUp}</div>
        <h1 class="res-headline">${headlines[level]}</h1>
        <p class="res-subline">${sublines[level]}</p>
        ${triage.urgency_note ? `<p class="urgency-note">⚡ ${triage.urgency_note}</p>` : ''}
      </div>

      ${metricsHtml}
      ${alertHtml}
      ${ticketHtml}

      <div class="ic" style="animation-delay:.35s">
        <div class="ic-t">🤖 AI Clinical Assessment</div>
        <p class="ic-body">${triage.reasoning}</p>
      </div>

      <div class="ic" style="animation-delay:.42s">
        <div class="ic-t">⚠️ Top Risk Factors</div>
        ${factorsHtml}
      </div>

      <div class="ic" style="animation-delay:.48s">
        <div class="ic-t">📋 Recommended Action</div>
        <p class="ic-body">${triage.recommended_action || triage.recommendations || ''}</p>
        ${triage.estimated_wait_minutes != null ? `<div class="wait-tag">⏱️ Est. wait: <strong>${triage.estimated_wait_minutes} min</strong></div>` : ''}
      </div>

      <div class="ic" style="animation-delay:.52s">
        <div class="ic-t">👤 Patient Summary</div>
        <div class="pt-grid">
          <div class="pt-item"><span class="pt-l">Name</span><span class="pt-v">${patient.name}</span></div>
          <div class="pt-item"><span class="pt-l">Age / Gender</span><span class="pt-v">${patient.age} yrs / ${patient.gender}</span></div>
          <div class="pt-item"><span class="pt-l">Symptoms</span><span class="pt-v">${patient.symptoms}</span></div>
          <div class="pt-item"><span class="pt-l">Duration</span><span class="pt-v">${patient.duration}</span></div>
          <div class="pt-item"><span class="pt-l">Pain Scale</span><span class="pt-v">${patient.pain_scale} / 10</span></div>
          <div class="pt-item"><span class="pt-l">Consciousness</span><span class="pt-v">${patient.consciousness}</span></div>
        </div>
      </div>

      ${notifHtml}

      <div class="act-row">
        <a href="/" class="btn-home">🏠 Back to Home</a>
        <a href="/intake" class="btn-ghost">📝 New Patient</a>
        <a href="/admin" class="btn-ghost">📊 Admin</a>
      </div>

      <div class="disc">
        ⚕️ This AI assessment is a guide only and does not replace professional medical diagnosis.<br/>
        Always follow the advice of qualified medical personnel. In case of emergency, call <strong style="color:#ef4444">108</strong>.
      </div>`;

    sessionStorage.removeItem('triageResult');
    window._triageCtx = { patient, triage, ticket, actions };

    // Animate bars
    setTimeout(() => {
      document.querySelectorAll('.bar-fill').forEach(el => {
        const w = el.style.getPropertyValue('--w') || el.style.width;
        el.style.width = w;
      });
    }, 600);

    // Confetti for routine
    if (level === 'routine') {
      for (let i = 0; i < 18; i++) {
        const c = document.createElement('div');
        const colors = ['#4361ee','#7b2d8b','#0cb8a8','#22c55e','#f59e0b'];
        c.style.cssText = `position:fixed;top:-10px;left:${Math.random()*100}vw;width:8px;height:8px;border-radius:2px;background:${colors[i%colors.length]};animation:confetti ${1.5+Math.random()*1.5}s ${Math.random()*0.8}s ease-in both;z-index:9999;pointer-events:none`;
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 3500);
      }
    }
  }

  function switchNotif(type, btn) {
    document.querySelectorAll('.ntab').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.nform').forEach(f=>f.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('notif-'+type).classList.add('active');
  }

  function setNotifStatus(id, msg, ok) {
    const el = document.getElementById(id);
    if (!el) return;
    el.innerHTML = `<span style="color:${ok?'#16a34a':'#dc2626'};font-weight:600">${msg}</span>`;
  }

  async function sendMedReminder() {
    const btn=document.getElementById('btnMedSend');
    const email=document.getElementById('nfMedEmail').value.trim();
    const names=document.getElementById('nfMedNames').value.trim();
    const freq=document.getElementById('nfMedFreq').value;
    const dur=document.getElementById('nfMedDur').value;
    if (!email||!names){setNotifStatus('nfMedStatus','⚠️ Email and medicine name required.',false);return}
    btn.disabled=true;btn.textContent='⏳ Sending...';
    const ctx=window._triageCtx||{};
    try {
      const r=await fetch('/api/notify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'medication_reminder',patient_name:ctx.patient?.name||'Patient',email,ticket:ctx.actions?.ticket_number||'',medications:[{name:names,dose:'',frequency:freq,duration:dur}],schedule:freq})});
      const d=await r.json();
      setNotifStatus('nfMedStatus',d.success?'✅ Reminder sent to '+email:'❌ Failed — check SMTP in .env',d.success);
    } catch(e){setNotifStatus('nfMedStatus','❌ Network error.',false)}
    btn.disabled=false;btn.textContent='📤 Send Medication Reminder';
  }

  async function sendApptReminder() {
    const btn=document.getElementById('btnApptSend');
    const email=document.getElementById('nfApptEmail').value.trim();
    const date=document.getElementById('nfApptDate').value;
    const time=document.getElementById('nfApptTime').value;
    const clinic=document.getElementById('nfApptClinic').value.trim();
    const notes=document.getElementById('nfApptNotes').value.trim();
    if (!email||!date||!time){setNotifStatus('nfApptStatus','⚠️ Email, date and time required.',false);return}
    btn.disabled=true;btn.textContent='⏳ Sending...';
    const ctx=window._triageCtx||{};
    try {
      const r=await fetch('/api/notify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'appointment_reminder',patient_name:ctx.patient?.name||'Patient',email,ticket:ctx.actions?.ticket_number||'',appointment_date:new Date(date).toLocaleDateString('en-IN',{day:'2-digit',month:'long',year:'numeric'}),appointment_time:time,clinic_name:clinic||'Rural Health Centre',notes})});
      const d=await r.json();
      setNotifStatus('nfApptStatus',d.success?'✅ Appointment reminder sent to '+email:'❌ Failed — check SMTP in .env',d.success);
    } catch(e){setNotifStatus('nfApptStatus','❌ Network error.',false)}
    btn.disabled=false;btn.textContent='📅 Send Appointment Reminder';
  }
</script>
</body>
</html>
