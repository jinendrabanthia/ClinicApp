<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Triage Results | TriageAID</title>
  <meta name="description" content="Your AI-powered triage assessment results." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #eff6ff;
      --surface: #ffffff;
      --border: #e5e7eb;
      --text: #1f2937;
      --text-muted: #6b7280;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg,#eff6ff 0%,#e0e7ff 50%,#dbeafe 100%);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
    }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; transition: all 1s ease;
    }
    body.critical::before { background: radial-gradient(ellipse 80% 60% at 50% 20%, rgba(239,68,68,0.1) 0%, transparent 65%); }
    body.urgent::before  { background: radial-gradient(ellipse 80% 60% at 50% 20%, rgba(249,115,22,0.08) 0%, transparent 65%); }
    body.routine::before { background: radial-gradient(ellipse 80% 60% at 50% 20%, rgba(16,185,129,0.07) 0%, transparent 65%); }

    nav {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; gap: 16px; padding: 14px 40px;
      background: rgba(255,255,255,0.88); backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(37,99,235,0.12);
      box-shadow: 0 1px 16px rgba(37,99,235,0.07);
    }
    .logo { display: flex; align-items: center; gap: 10px; font-family: 'Poppins',sans-serif; font-size: 18px; font-weight: 700; color: #111827; }
    .logo span { color: #2563eb; }
    .logo-icon { width: 36px; height: 36px; background: linear-gradient(135deg,#2563eb,#4f46e5); border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 18px; box-shadow: 0 4px 12px rgba(37,99,235,.35); }

    main { max-width: 820px; margin: 0 auto; padding: 48px 24px 100px; }

    .result-card {
      border-radius: 24px; border: 1px solid;
      padding: 44px 40px; text-align: center;
      position: relative; overflow: hidden; margin-bottom: 22px;
      background: #fff;
      animation: fadeIn .6s cubic-bezier(0.34,1.56,.64,1) both;
    }
    @keyframes fadeIn { from{opacity:0;transform:scale(.93)} to{opacity:1;transform:scale(1)} }
    .result-card.critical { border-color: rgba(239,68,68,.35); background: linear-gradient(135deg,#fff5f5,#fff); }
    .result-card.urgent   { border-color: rgba(249,115,22,.3); background: linear-gradient(135deg,#fff7ed,#fff); }
    .result-card.routine  { border-color: rgba(16,185,129,.3); background: linear-gradient(135deg,#f0fdf4,#fff); }

    .pulse-ring { position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:200px;height:200px;border-radius:50%;pointer-events:none; }
    .critical .pulse-ring { border:2px solid rgba(239,68,68,.3); animation:pulse-expand 2s ease-out infinite; }
    @keyframes pulse-expand { 0%{transform:translate(-50%,-50%) scale(.5);opacity:1} 100%{transform:translate(-50%,-50%) scale(2);opacity:0} }

    .level-icon { font-size: 72px; margin-bottom: 16px; position: relative; z-index: 1; display: block; }
    .level-badge-big {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 9px 26px; border-radius: 40px;
      font-family: 'Poppins',sans-serif; font-size: 19px; font-weight: 800; letter-spacing: 2px;
      margin-bottom: 16px; position: relative; z-index: 1;
    }
    .critical .level-badge-big { background: rgba(239,68,68,.12); border: 2px solid rgba(239,68,68,.5); color: #dc2626; }
    .urgent   .level-badge-big { background: rgba(249,115,22,.12); border: 2px solid rgba(249,115,22,.5); color: #ea580c; }
    .routine  .level-badge-big { background: rgba(16,185,129,.12); border: 2px solid rgba(16,185,129,.5); color: #16a34a; }
    .level-dot-big { width:11px;height:11px;border-radius:50%; }
    .critical .level-dot-big { background:#ef4444;animation:blink 1.2s infinite;box-shadow:0 0 10px rgba(239,68,68,.8); }
    .urgent   .level-dot-big { background:#f97316;box-shadow:0 0 10px rgba(249,115,22,.8); }
    .routine  .level-dot-big { background:#10b981;box-shadow:0 0 10px rgba(16,185,129,.8); }
    @keyframes blink { 0%,100%{opacity:1}50%{opacity:.2} }

    .result-headline { font-family:'Poppins',sans-serif;font-size:23px;font-weight:700;margin-bottom:7px;position:relative;z-index:1;color:#111827; }
    .result-subline { font-size:14px;color:var(--text-muted);position:relative;z-index:1; }

    /* Urgency note */
    .urgency-note { font-size:14px;font-weight:600;margin-top:12px;position:relative;z-index:1; }
    .critical .urgency-note { color:#dc2626; }
    .urgent   .urgency-note { color:#ea580c; }
    .routine  .urgency-note { color:#16a34a; }

    /* Risk gauge row */
    .metrics-row { display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:22px; }
    @media(max-width:600px){.metrics-row{grid-template-columns:1fr 1fr;}}
    .metric-card { background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.05); }
    .metric-lbl { font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-muted);margin-bottom:8px;font-weight:600; }
    .metric-val { font-family:'Poppins',sans-serif;font-size:26px;font-weight:800;color:#111827; }
    .risk-gauge { width:100%;height:8px;background:#e5e7eb;border-radius:4px;margin-top:8px;overflow:hidden; }
    .risk-fill { height:100%;border-radius:4px;transition:width .6s ease; }
    .conf-bar { width:100%;height:8px;background:#e5e7eb;border-radius:4px;margin-top:8px;overflow:hidden; }
    .conf-fill { height:100%;background:linear-gradient(90deg,#2563eb,#4f46e5);border-radius:4px; }
    .escalated-badge { display:inline-flex;align-items:center;gap:5px;background:#fef3c7;border:1px solid #fcd34d;border-radius:20px;padding:3px 11px;font-size:11px;font-weight:700;color:#92400e;margin-top:6px; }

    /* Ticket */
    .ticket-box { background:#ecfeff;border:2px dashed rgba(8,145,178,.4);border-radius:16px;padding:22px;margin-bottom:20px;text-align:center;animation:fadeIn .6s .3s both; }
    .ticket-label { font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px; }
    .ticket-num { font-family:'Poppins',sans-serif;font-size:34px;font-weight:800;color:#0891b2;letter-spacing:4px; }

    /* Alert / status boxes */
    .alert-box { border-radius:14px;padding:16px 20px;margin-bottom:18px;display:flex;align-items:flex-start;gap:14px;animation:fadeIn .6s .2s both; }
    .alert-box.sent    { background:#f0fdf4;border:1px solid rgba(34,197,94,.3); }
    .alert-box.warning { background:#fff7ed;border:1px solid rgba(249,115,22,.3); }
    .alert-icon { font-size:26px;flex-shrink:0; }
    .alert-title { font-family:'Poppins',sans-serif;font-size:15px;font-weight:600;margin-bottom:3px;color:#16a34a; }
    .alert-title.warn { color:#ea580c; }
    .alert-desc { font-size:13px;color:var(--text-muted);line-height:1.6; }

    /* Info cards */
    .info-card { background:#fff;border:1px solid var(--border);border-radius:18px;padding:24px;margin-bottom:18px;animation:fadeIn .6s .35s both;box-shadow:0 2px 8px rgba(0,0,0,.04); }
    .info-card-title { font-family:'Poppins',sans-serif;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:#2563eb;margin-bottom:12px; }
    .info-text { font-size:14px;color:var(--text);line-height:1.85; }

    /* Top risk factors */
    .factors-list { display:flex;flex-wrap:wrap;gap:8px;margin-top:4px; }
    .factor-chip { display:flex;align-items:center;gap:5px;padding:5px 13px;background:#fef2f2;border:1px solid rgba(239,68,68,.22);border-radius:20px;font-size:12px;font-weight:600;color:#b91c1c; }

    /* Wait time */
    .wait-tag { margin-top:12px;display:inline-flex;align-items:center;gap:7px;padding:8px 14px;background:#f1f5f9;border-radius:9px;font-size:13px;color:#475569; }

    /* Patient grid */
    .patient-grid { display:grid;grid-template-columns:1fr 1fr;gap:10px; }
    .patient-item { display:flex;flex-direction:column;gap:4px;background:#f8fafc;border-radius:9px;padding:10px 12px; }
    .patient-label { font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px; }
    .patient-value { font-size:13px;color:var(--text);font-weight:600; }

    /* ── NOTIFICATION PANEL ── */
    .notif-panel { background:#fff;border:1px solid #dbeafe;border-radius:18px;padding:26px;margin-bottom:18px;animation:fadeIn .6s .5s both;box-shadow:0 2px 8px rgba(37,99,235,.07); }
    .notif-title { font-family:'Poppins',sans-serif;font-size:15px;font-weight:700;color:#111827;margin-bottom:4px;display:flex;align-items:center;gap:8px; }
    .notif-sub { font-size:12px;color:var(--text-muted);margin-bottom:20px; }
    .notif-tabs { display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap; }
    .ntab { padding:7px 18px;border-radius:20px;border:1.5px solid #e5e7eb;background:#f9fafb;font-size:13px;font-weight:600;color:#6b7280;cursor:pointer;transition:all .2s; }
    .ntab.active { background:#dbeafe;border-color:#2563eb;color:#1e40af; }
    .notif-form { display:none; }
    .notif-form.active { display:block; }
    .nf-row { margin-bottom:12px; }
    .nf-label { font-size:12px;font-weight:600;color:#4b5563;margin-bottom:5px;display:block; }
    .nf-input { width:100%;border:1.5px solid #e5e7eb;border-radius:9px;padding:10px 13px;font-size:13px;font-family:'Inter',sans-serif;color:var(--text);outline:none;transition:border-color .2s; }
    .nf-input:focus { border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1); }
    .nf-grid { display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px; }
    @media(max-width:540px){.nf-grid{grid-template-columns:1fr;}}
    .btn-send-notif { width:100%;padding:12px;background:linear-gradient(135deg,#2563eb,#4f46e5);border:none;border-radius:11px;color:#fff;font-family:'Poppins',sans-serif;font-weight:700;font-size:14px;cursor:pointer;transition:all .2s;margin-top:4px; }
    .btn-send-notif:hover { transform:translateY(-2px);box-shadow:0 6px 20px rgba(37,99,235,.35); }
    .btn-send-notif:disabled { opacity:.6;cursor:not-allowed;transform:none; }
    .notif-status { font-size:13px;margin-top:10px;text-align:center;min-height:20px; }

    /* Actions */
    .actions-row { display:flex;gap:12px;flex-wrap:wrap;margin-top:28px;animation:fadeIn .6s .55s both; }
    .btn-home { flex:1;min-width:180px;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 24px;background:linear-gradient(135deg,#2563eb,#4f46e5);border:none;border-radius:13px;color:#fff;font-family:'Poppins',sans-serif;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;transition:all .3s;box-shadow:0 6px 20px rgba(37,99,235,.35); }
    .btn-home:hover { transform:translateY(-2px);box-shadow:0 10px 28px rgba(37,99,235,.45); }
    .btn-ghost { flex:1;min-width:150px;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;background:#fff;border:1.5px solid #e5e7eb;border-radius:13px;color:var(--text-muted);font-size:14px;cursor:pointer;text-decoration:none;transition:all .2s; }
    .btn-ghost:hover { border-color:#2563eb;color:#2563eb; }

    .disclaimer { text-align:center;font-size:12px;color:#9ca3af;margin-top:36px;line-height:1.7;padding:14px;border:1px solid rgba(37,99,235,.08);border-radius:10px; }

    @media(max-width:600px) {
      .result-card { padding:28px 18px; }
      .patient-grid { grid-template-columns:1fr; }
      .actions-row { flex-direction:column; }
    }
  </style>
</head>
<body id="resultBody">

  <nav>
    <a href="/" style="color:#6b7280;text-decoration:none;font-size:14px;">← Home</a>
    <div style="flex:1"></div>
    <div class="logo">
      <div class="logo-icon">🏥</div>
      <span>Rapid<span>AID</span></span>
    </div>
    <div style="flex:1"></div>
  </nav>

  <main id="mainContent">
    <div style="text-align:center;padding:80px 24px;color:#64748b;">
      <div style="font-size:40px;margin-bottom:16px;">⏳</div>
      <p>Loading triage result...</p>
    </div>
  </main>

  <script>
    const raw = sessionStorage.getItem('triageResult');
    if (!raw) {
      document.getElementById('mainContent').innerHTML = `
        <div style="text-align:center;padding:80px 24px;">
          <div style="font-size:60px;margin-bottom:20px;">⚠️</div>
          <h2 style="font-family:'Poppins',sans-serif;font-size:24px;margin-bottom:12px;color:#111827;">No result found</h2>
          <p style="color:#6b7280;margin-bottom:28px;">Please complete the patient intake form first.</p>
          <a href="/intake" style="display:inline-flex;align-items:center;gap:10px;padding:14px 32px;background:linear-gradient(135deg,#2563eb,#4f46e5);border-radius:12px;color:#fff;font-family:'Poppins',sans-serif;font-size:16px;font-weight:700;text-decoration:none;">Start Intake →</a>
        </div>`;
    } else {
      const data    = JSON.parse(raw);
      const triage  = data.triage;
      const patient = data.patient_data;
      const actions = data.actions || {};
      const level   = (triage.level || 'ROUTINE').toLowerCase();
      const lvlUp   = triage.level || 'ROUTINE';

      document.body.classList.add(level);

      const icons = { critical:'🚨', urgent:'⚠️', routine:'✅' };
      const headlines = {
        critical: 'Immediate Medical Attention Required',
        urgent:   'Same-Day Medical Attention Needed',
        routine:  "Routine Care — You're in the Queue"
      };
      const sublines = {
        critical: 'This case has been flagged as life-threatening. A doctor has been alerted immediately.',
        urgent:   'This case requires prompt attention. You have been added to the priority queue.',
        routine:  "Your condition can be managed with routine care. You've been added to the waiting list."
      };

      /* ── Metrics ── */
      const riskScore  = triage.risk_score || 0;
      const confidence = triage.confidence || 0.75;
      const escalated  = triage.escalated || false;
      const riskColor  = riskScore >= 75 ? '#dc2626' : riskScore >= 45 ? '#ea580c' : '#16a34a';
      const confPct    = Math.round(confidence * 100);

      const metricsHtml = `
        <div class="metrics-row">
          <div class="metric-card">
            <div class="metric-lbl">Risk Score</div>
            <div class="metric-val" style="color:${riskColor};">${riskScore}<span style="font-size:14px;color:#9ca3af;">/100</span></div>
            <div class="risk-gauge"><div class="risk-fill" style="width:${riskScore}%;background:${riskColor};"></div></div>
            ${escalated ? '<div class="escalated-badge">⬆️ Safety Escalated</div>' : ''}
          </div>
          <div class="metric-card">
            <div class="metric-lbl">AI Confidence</div>
            <div class="metric-val" style="color:#2563eb;">${confPct}<span style="font-size:14px;color:#9ca3af;">%</span></div>
            <div class="conf-bar"><div class="conf-fill" style="width:${confPct}%;"></div></div>
          </div>
          <div class="metric-card">
            <div class="metric-lbl">Wait Estimate</div>
            <div class="metric-val" style="color:#4b5563;">${triage.estimated_wait_minutes ? triage.estimated_wait_minutes+'<span style="font-size:14px;color:#9ca3af;"> min</span>' : '—'}</div>
            <div style="font-size:11px;color:#9ca3af;margin-top:8px;">Approx. queue time</div>
          </div>
        </div>`;

      /* ── Alert box ── */
      const alertHtml = level !== 'routine' ? `
        <div class="alert-box sent">
          <div class="alert-icon">📧</div>
          <div>
            <div class="alert-title">Doctor Alert Sent</div>
            <div class="alert-desc">An immediate alert has been dispatched to the clinic doctor with your complete patient details. Please remain at the clinic and inform the front desk staff.</div>
          </div>
        </div>` : '';

      /* ── Ticket ── */
      const ticket = actions.ticket_number;
      const ticketHtml = ticket ? `
        <div class="ticket-box">
          <div class="ticket-label">Your Waiting List Ticket</div>
          <div class="ticket-num">${ticket}</div>
          <div style="margin-top:8px;font-size:13px;color:#6b7280;">Show this number at the clinic counter</div>
          ${patient.email ? '<div style="margin-top:6px;font-size:12px;color:#16a34a;">📨 Confirmation sent to your email</div>' : ''}
        </div>` : '';

      /* ── Top risk factors ── */
      const factors = triage.top_risk_factors || triage.red_flags || [];
      const factorsHtml = factors.length ? `
        <div class="factors-list">${factors.map(f=>`<div class="factor-chip">⚠ ${f}</div>`).join('')}</div>` :
        '<p style="font-size:13px;color:#9ca3af;">No specific risk factors identified.</p>';

      /* ── Urgency note ── */
      const urgencyNote = triage.urgency_note || '';

      /* ── Notification panel (shown if patient has email) ── */
      const emailVal = patient.email || '';
      const notifHtml = `
        <div class="notif-panel">
          <div class="notif-title">🔔 Set Up Reminders</div>
          <div class="notif-sub">Receive medication reminders and appointment notifications by email.</div>
          <div class="notif-tabs">
            <button class="ntab active" onclick="switchNotif('med', this)">💊 Medication Reminder</button>
            <button class="ntab" onclick="switchNotif('appt', this)">📅 Appointment Reminder</button>
          </div>

          <!-- Medication form -->
          <div class="notif-form active" id="notif-med">
            <div class="nf-row">
              <label class="nf-label">Your Email</label>
              <input class="nf-input" id="nfMedEmail" type="email" value="${emailVal}" placeholder="patient@example.com" />
            </div>
            <div class="nf-row">
              <label class="nf-label">Medicine Name(s)</label>
              <input class="nf-input" id="nfMedNames" placeholder="e.g. Paracetamol 500mg, ORS" />
            </div>
            <div class="nf-grid">
              <div>
                <label class="nf-label">Frequency</label>
                <select class="nf-input" id="nfMedFreq">
                  <option>Once Daily (Morning)</option>
                  <option>Twice Daily (Morning &amp; Night)</option>
                  <option>Three Times Daily</option>
                  <option>SOS (As needed)</option>
                </select>
              </div>
              <div>
                <label class="nf-label">Duration (days)</label>
                <input class="nf-input" id="nfMedDur" type="number" min="1" max="90" placeholder="e.g. 5" />
              </div>
            </div>
            <button class="btn-send-notif" id="btnMedSend" onclick="sendMedReminder()">📤 Send Medication Reminder</button>
            <div class="notif-status" id="nfMedStatus"></div>
          </div>

          <!-- Appointment form -->
          <div class="notif-form" id="notif-appt">
            <div class="nf-row">
              <label class="nf-label">Your Email</label>
              <input class="nf-input" id="nfApptEmail" type="email" value="${emailVal}" placeholder="patient@example.com" />
            </div>
            <div class="nf-grid">
              <div>
                <label class="nf-label">Appointment Date</label>
                <input class="nf-input" id="nfApptDate" type="date" />
              </div>
              <div>
                <label class="nf-label">Appointment Time</label>
                <input class="nf-input" id="nfApptTime" type="time" />
              </div>
            </div>
            <div class="nf-row">
              <label class="nf-label">Clinic / Doctor</label>
              <input class="nf-input" id="nfApptClinic" placeholder="e.g. Dr. Rajan — PHC Meerut" />
            </div>
            <div class="nf-row">
              <label class="nf-label">Notes (optional)</label>
              <input class="nf-input" id="nfApptNotes" placeholder="e.g. Bring previous reports, fasting required" />
            </div>
            <button class="btn-send-notif" id="btnApptSend" onclick="sendApptReminder()">📅 Send Appointment Reminder</button>
            <div class="notif-status" id="nfApptStatus"></div>
          </div>
        </div>`;

      document.getElementById('mainContent').innerHTML = `
        <div class="result-card ${level}">
          <div class="pulse-ring"></div>
          <span class="level-icon">${icons[level]}</span>
          <div class="level-badge-big"><span class="level-dot-big"></span>${lvlUp}</div>
          <h1 class="result-headline">${headlines[level]}</h1>
          <p class="result-subline">${sublines[level]}</p>
          ${urgencyNote ? `<p class="urgency-note">⚡ ${urgencyNote}</p>` : ''}
        </div>

        ${metricsHtml}
        ${alertHtml}
        ${ticketHtml}

        <div class="info-card">
          <div class="info-card-title">🤖 AI Clinical Assessment</div>
          <p class="info-text">${triage.reasoning}</p>
        </div>

        <div class="info-card">
          <div class="info-card-title">⚠️ Top Risk Factors</div>
          ${factorsHtml}
        </div>

        <div class="info-card">
          <div class="info-card-title">📋 Recommended Action</div>
          <p class="info-text">${triage.recommended_action || triage.recommendations || ''}</p>
          ${triage.estimated_wait_minutes ? `<div class="wait-tag">⏱️ Est. wait: <strong>${triage.estimated_wait_minutes} min</strong></div>` : ''}
        </div>

        <div class="info-card">
          <div class="info-card-title">👤 Patient Summary</div>
          <div class="patient-grid">
            <div class="patient-item"><span class="patient-label">Name</span><span class="patient-value">${patient.name}</span></div>
            <div class="patient-item"><span class="patient-label">Age / Gender</span><span class="patient-value">${patient.age} yrs / ${patient.gender}</span></div>
            <div class="patient-item"><span class="patient-label">Symptoms</span><span class="patient-value">${patient.symptoms}</span></div>
            <div class="patient-item"><span class="patient-label">Duration</span><span class="patient-value">${patient.duration}</span></div>
            <div class="patient-item"><span class="patient-label">Pain Scale</span><span class="patient-value">${patient.pain_scale} / 10</span></div>
            <div class="patient-item"><span class="patient-label">Consciousness</span><span class="patient-value">${patient.consciousness}</span></div>
          </div>
        </div>

        ${notifHtml}

        <div class="actions-row">
          <a href="/" class="btn-home">🏠 Back to Home</a>
          <a href="/intake" class="btn-ghost">📝 New Patient</a>
          <a href="/admin" class="btn-ghost">📊 Admin</a>
        </div>

        <div class="disclaimer">
          ⚕️ This AI assessment is a TriageAIDd only and does not replace professional medical diagnosis.<br />
          Always follow the advice of qualified medical personnel. In case of emergency, call <strong>108</strong>.
        </div>
      `;

      sessionStorage.removeItem('triageResult');

      /* ── Notification helpers ── */
      window._triageCtx = { patient, triage, ticket, actions };
    }

    function switchNotif(type, btn) {
      document.querySelectorAll('.ntab').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('.notif-form').forEach(f=>f.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('notif-'+type).classList.add('active');
    }

    function setNotifStatus(id, msg, ok) {
      const el = document.getElementById(id);
      if (!el) return;
      el.innerHTML = `<span style="color:${ok?'#16a34a':'#dc2626'};font-weight:600;">${msg}</span>`;
    }

    async function sendMedReminder() {
      const btn   = document.getElementById('btnMedSend');
      const email = document.getElementById('nfMedEmail').value.trim();
      const names = document.getElementById('nfMedNames').value.trim();
      const freq  = document.getElementById('nfMedFreq').value;
      const dur   = document.getElementById('nfMedDur').value;
      if (!email || !names) { setNotifStatus('nfMedStatus','⚠️ Email and medicine name required.',false); return; }
      btn.disabled = true; btn.textContent = '⏳ Sending...';
      const ctx = window._triageCtx || {};
      const payload = {
        type: 'medication_reminder',
        patient_name: ctx.patient?.name || 'Patient',
        email,
        ticket: ctx.actions?.ticket_number || '',
        medications: [{ name: names, dose: '', frequency: freq, duration: dur }],
        schedule: freq
      };
      try {
        const r = await fetch('/api/notify', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
        const d = await r.json();
        setNotifStatus('nfMedStatus', d.success ? '✅ Reminder sent to '+email : '❌ Failed — check SMTP in .env', d.success);
      } catch(e) { setNotifStatus('nfMedStatus','❌ Network error.',false); }
      btn.disabled = false; btn.textContent = '📤 Send Medication Reminder';
    }

    async function sendApptReminder() {
      const btn   = document.getElementById('btnApptSend');
      const email = document.getElementById('nfApptEmail').value.trim();
      const date  = document.getElementById('nfApptDate').value;
      const time  = document.getElementById('nfApptTime').value;
      const clinic= document.getElementById('nfApptClinic').value.trim();
      const notes = document.getElementById('nfApptNotes').value.trim();
      if (!email || !date || !time) { setNotifStatus('nfApptStatus','⚠️ Email, date and time required.',false); return; }
      btn.disabled = true; btn.textContent = '⏳ Sending...';
      const ctx = window._triageCtx || {};
      const payload = {
        type: 'appointment_reminder',
        patient_name: ctx.patient?.name || 'Patient',
        email,
        ticket: ctx.actions?.ticket_number || '',
        appointment_date: new Date(date).toLocaleDateString('en-IN',{day:'2-digit',month:'long',year:'numeric'}),
        appointment_time: time,
        clinic_name: clinic || 'Rural Health Centre',
        notes
      };
      try {
        const r = await fetch('/api/notify', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
        const d = await r.json();
        setNotifStatus('nfApptStatus', d.success ? '✅ Appointment reminder sent to '+email : '❌ Failed — check SMTP in .env', d.success);
      } catch(e) { setNotifStatus('nfApptStatus','❌ Network error.',false); }
      btn.disabled = false; btn.textContent = '📅 Send Appointment Reminder';
    }
  </script>
</body>
</html>
